# --------------------------------------------------------------
# Version E – External Trigger (single‑step manifest fetch, jq fixed)
# --------------------------------------------------------------
# This workflow:
#   1️⃣ Retrieves the latest Manager.io release tag.
#   2️⃣ Pulls the OCI manifest list for the `latest` tag from GHCR
#      and extracts the amd64 digest in a single command.
#   3️⃣ Pulls that architecture‑specific manifest (contains the config).
#   4️⃣ Reads the OCI label `org.opencontainers.image.version`.
#   5️⃣ Compares it to the upstream tag and dispatches Builder only
#      when the versions differ.
# --------------------------------------------------------------

name: External Trigger
on:
  workflow_dispatch:

# --------------------------------------------------------------
# Permissions needed:
#   contents: write   → create/update a GitHub release (if you later use ncipollo/release-action)
#   packages: read    → pull image manifests from GHCR
#   actions: write    → dispatch the Builder workflow
# --------------------------------------------------------------
permissions:
  contents: write
  packages: read
  actions: write

jobs:
  external-trigger:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}          # e.g. gabrielenterprises/docker_manager_io
      IMAGE_TAG: latest                       # tag we inspect on GHCR
    steps:
      # --------------------------------------------------------------
      # 1️⃣ Retrieve the latest upstream Manager.io version
      # --------------------------------------------------------------
      - name: Retrieve External Version
        id: extver
        run: |
          EXT_RELEASE=$(curl -sL https://api.github.com/repos/Manager-io/Manager/releases/latest | jq -r '.tag_name')
          if [ -z "$EXT_RELEASE" ] || [ "$EXT_RELEASE" = "null" ]; then
            echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
            echo "> Can't retrieve external version, exiting." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "External version: $EXT_RELEASE" >> $GITHUB_STEP_SUMMARY
          echo "EXT_RELEASE=$EXT_RELEASE" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------
      # 2️⃣ Get a short‑lived token that can pull from GHCR
      # --------------------------------------------------------------
      - name: Get GHCR pull token
        id: ghcr_token
        run: |
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r '.token')
          if [ -z "$TOKEN" ]; then
            echo "❌ Failed to obtain GHCR token" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # Export the token for later steps
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 3️⃣ Pull manifest list **and** extract the amd64 digest (single step)
      # --------------------------------------------------------------
      - name: Get amd64 manifest digest
        id: arch_digest
        run: |
          # `-f` makes curl fail on HTTP >=400, `-s` silences progress
          ARCH_DIGEST=$(curl -sf \
            -H "Authorization: Bearer ${{ steps.ghcr_token.outputs.token }}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${IMAGE_TAG}" |
            jq -r '
              # Abort early if the response contains an error object
              if has("errors") then
                halt_error(1; "GHCR returned an error object")
              end
              # Pick the amd64 digest; if none, fall back to the first manifest
              .manifests[]?
              | select(.platform.architecture == "amd64")
              | .digest
              // .manifests[0].digest
            ') || {
            echo "❌ Failed to obtain architecture digest (bad token, missing tag, or malformed manifest)." >> $GITHUB_STEP_SUMMARY
            exit 1
          }

          if [ -z "$ARCH_DIGEST" ]; then
            echo "❌ Architecture digest resolved to empty – something went wrong." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "digest=$ARCH_DIGEST" >> $GITHUB_OUTPUT
        env:
          REPO: ${{ env.REPO }}

      # --------------------------------------------------------------
      # 4️⃣ Pull the architecture manifest (contains the config with labels)
      # --------------------------------------------------------------
      - name: Pull architecture manifest
        id: arch_manifest
        run: |
          MANIFEST=$(curl -sf \
            -H "Authorization: Bearer ${{ steps.ghcr_token.outputs.token }}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${{ steps.arch_digest.outputs.digest }}") || {
            echo "❌ Failed to fetch architecture manifest (bad digest or token)." >> $GITHUB_STEP_SUMMARY
            exit 1
          }

          # Store as a multiline output (required syntax)
          echo "manifest<<EOF" >> $GITHUB_OUTPUT
          echo "$MANIFEST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          REPO: ${{ env.REPO }}

      # --------------------------------------------------------------
      # 5️⃣ Extract the OCI version label from the manifest
      # --------------------------------------------------------------
      - name: Extract image version label
        id: imgver
        run: |
          IMG_LABEL=$(echo "${{ steps.arch_manifest.outputs.manifest }}" |
            jq -r '
              .container_config.Labels["org.opencontainers.image.version"] //
              .config.Labels["org.opencontainers.image.version"] //
              empty
            ')
          if [ -z "$IMG_LABEL" ]; then
            echo "⚠️ Could not read version label from the image." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Found image version label: $IMG_LABEL"
          echo "image_version=$IMG_LABEL" >> $GITHUB_OUTPUT
        env:
          REPO: ${{ env.REPO }}

      # --------------------------------------------------------------
      # 6️⃣ Compare upstream version vs. image version, trigger Builder if needed
      # --------------------------------------------------------------
      - name: Compare versions and possibly trigger Builder
        run: |
          if [ "${EXT_RELEASE}" = "${IMAGE_VERSION}" ]; then
            echo "✅ Versions match (both = ${EXT_RELEASE}); nothing to do." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "🚀 New upstream version **${EXT_RELEASE}** differs from image version **${IMAGE_VERSION}**." >> $GITHUB_STEP_SUMMARY
          echo "Dispatching Builder workflow…" >> $GITHUB_STEP_SUMMARY

          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"ref\":\"refs/heads/${{ github.ref_name }}\"}" \
            "https://api.github.com/repos/${REPO}/actions/workflows/builder.yml/dispatches"
        env:
          EXT_RELEASE: ${{ env.EXT_RELEASE }}
          IMAGE_VERSION: ${{ steps.imgver.outputs.image_version }}
          REPO: ${{ env.REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
