# --------------------------------------------------------------
# Version K – External Trigger
# OCI Image Version Detection and Builder Dispatch
# --------------------------------------------------------------
# This workflow:
#   1️⃣ Retrieves the latest Manager.io release tag from upstream
#   2️⃣ Fetches the OCI manifest list from GHCR for the latest tag
#   3️⃣ Extracts the amd64 architecture-specific digest
#   4️⃣ Fetches that architecture's manifest
#   5️⃣ Extracts the config blob digest and fetches the config
#   6️⃣ Reads the OCI label org.opencontainers.image.version
#   7️⃣ Compares versions and dispatches Builder workflow if needed
# --------------------------------------------------------------

name: External Trigger
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  external-trigger:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      IMAGE_TAG: latest
    steps:
      # Step 1: Retrieve upstream version
      - name: Retrieve External Version
        id: extver
        run: |
          EXT_RELEASE=$(curl -sL https://api.github.com/repos/Manager-io/Manager/releases/latest | jq -r '.tag_name')
          if [ -z "$EXT_RELEASE" ] || [ "$EXT_RELEASE" = "null" ]; then
            echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
            echo "> Can't retrieve external version, exiting." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "External version: $EXT_RELEASE" >> $GITHUB_STEP_SUMMARY
          echo "EXT_RELEASE=$EXT_RELEASE" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Get GHCR authentication token
      - name: Get GHCR pull token
        id: ghcr_token
        run: |
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r '.token')
          if [ -z "$TOKEN" ]; then
            echo "❌ Failed to obtain GHCR token" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # Step 3: Fetch manifest index and extract amd64 digest
      - name: Get amd64 manifest digest
        id: arch_digest
        run: |
          MANIFEST_INDEX=$(curl -sf \
            -H "Authorization: Bearer ${{ steps.ghcr_token.outputs.token }}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${IMAGE_TAG}") || {
            echo "❌ Failed to fetch manifest index (bad token, missing tag, or connection error)." >> $GITHUB_STEP_SUMMARY
            exit 1
          }

          # Check for error response
          if echo "$MANIFEST_INDEX" | jq -e 'has("errors")' > /dev/null 2>&1; then
            ERROR_MSG=$(echo "$MANIFEST_INDEX" | jq -r '.errors[0].message // "unknown error"')
            echo "❌ GHCR returned an error: $ERROR_MSG" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Extract amd64 digest, fallback to first manifest if not found
          ARCH_DIGEST=$(echo "$MANIFEST_INDEX" | jq -r '.manifests[]? | select(.platform.architecture == "amd64") | .digest' | head -n1)
          if [ -z "$ARCH_DIGEST" ]; then
            ARCH_DIGEST=$(echo "$MANIFEST_INDEX" | jq -r '.manifests[0].digest')
          fi

          if [ -z "$ARCH_DIGEST" ]; then
            echo "❌ Failed to extract architecture digest." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "digest=$ARCH_DIGEST" >> $GITHUB_OUTPUT

      # Step 4: Fetch the architecture-specific manifest
      - name: Get architecture manifest
        id: arch_manifest
        run: |
          MANIFEST=$(curl -sf \
            -H "Authorization: Bearer ${{ steps.ghcr_token.outputs.token }}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${{ steps.arch_digest.outputs.digest }}") || {
            echo "❌ Failed to fetch architecture manifest." >> $GITHUB_STEP_SUMMARY
            exit 1
          }

          # Extract config digest from manifest
          CONFIG_DIGEST=$(echo "$MANIFEST" | jq -r '.config.digest')
          if [ -z "$CONFIG_DIGEST" ]; then
            echo "❌ Failed to extract config digest from manifest." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "config_digest=$CONFIG_DIGEST" >> $GITHUB_OUTPUT

      # Step 5: Fetch the config blob (contains image labels)
      - name: Fetch config blob
        id: config_blob
        run: |
          CONFIG=$(curl -sf \
            -H "Authorization: Bearer ${{ steps.ghcr_token.outputs.token }}" \
            "https://ghcr.io/v2/${REPO}/blobs/${{ steps.arch_manifest.outputs.config_digest }}") || {
            echo "❌ Failed to fetch config blob." >> $GITHUB_STEP_SUMMARY
            exit 1
          }

          echo "blob<<EOF" >> $GITHUB_OUTPUT
          echo "$CONFIG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Step 6: Extract image version label from config
      - name: Extract image version label
        id: imgver
        run: |
          IMG_LABEL=$(echo "${{ steps.config_blob.outputs.blob }}" | jq -r '.config.Labels["org.opencontainers.image.version"] // empty')

          if [ -z "$IMG_LABEL" ]; then
            echo "⚠️ Could not extract version label from image config." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ Found image version: $IMG_LABEL" >> $GITHUB_STEP_SUMMARY
          echo "image_version=$IMG_LABEL" >> $GITHUB_OUTPUT

      # Step 7: Compare versions and dispatch Builder if needed
      - name: Compare versions and trigger Builder
        run: |
          if [ "${EXT_RELEASE}" = "${{ steps.imgver.outputs.image_version }}" ]; then
            echo "✅ Versions match (both = ${EXT_RELEASE}); no action needed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "🚀 Version mismatch detected!" >> $GITHUB_STEP_SUMMARY
          echo "   Upstream: ${EXT_RELEASE}" >> $GITHUB_STEP_SUMMARY
          echo "   Image: ${{ steps.imgver.outputs.image_version }}" >> $GITHUB_STEP_SUMMARY
          echo "Dispatching Builder workflow…" >> $GITHUB_STEP_SUMMARY

          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"ref\":\"refs/heads/${{ github.ref_name }}\"}" \
            "https://api.github.com/repos/${REPO}/actions/workflows/builder.yml/dispatches"
        env:
          EXT_RELEASE: ${{ env.EXT_RELEASE }}
