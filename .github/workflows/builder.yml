name: Builder
on:
  schedule:
    - cron: "0 0 * * *"  # daily at 00:00 UTC
  workflow_dispatch:      # manual trigger
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/dependabot.yml'
      - '.github/workflows/builder.yml'

# --------------------------------------------------------------
# Explicit permissions for the automatically‑provided GITHUB_TOKEN
# --------------------------------------------------------------
permissions:
  contents: write        # needed to create a GitHub release (tag + release) and commit manifests
  packages: write        # needed to push to GHCR
  id-token: write        # needed for Cosign keyless signing

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.check.outputs.new-version }}
      should-build: ${{ steps.check.outputs.should-build }}
      release-tag: ${{ steps.check.outputs.release-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # fetch all history to get tags

      - name: Check for version change
        id: check
        run: |
          # Get latest upstream Manager.io version
          LATEST=$(curl -sL https://api.github.com/repos/Manager-io/Manager/releases/latest | jq -r '.tag_name')
          
          # Validate that we got a valid version
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "❌ Failed to retrieve upstream version"
            exit 1
          fi
          
          echo "Latest upstream version: $LATEST"
          
          # Get last built version from repo tags
          LAST_BUILT=$(git tag --sort=-version:refname | head -n1)
          if [ -z "$LAST_BUILT" ]; then
            LAST_BUILT="none"
          fi
          echo "Last built version: $LAST_BUILT"
          
          # Strip characters that are unsafe for Docker tags
          RELEASE_TAG=$(echo "${LATEST}" | tr -d 'v~,%@+;:/ ')
          echo "Sanitized release tag: $RELEASE_TAG"
          
          # Normalize versions by removing 'v' prefix for comparison
          LATEST_NORMALIZED=$(echo "${LATEST}" | sed 's/^v//')
          LAST_BUILT_NORMALIZED=$(echo "${LAST_BUILT}" | sed 's/^v//')
          
          # Only build if versions differ
          if [ "$LATEST_NORMALIZED" != "$LAST_BUILT_NORMALIZED" ]; then
            echo "✅ Version changed from $LAST_BUILT to $LATEST - build required"
            {
              echo "should-build=true"
              echo "new-version=$LATEST"
              echo "release-tag=$RELEASE_TAG"
            } >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ Version unchanged ($LATEST) - skipping build"
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check-version
    if: |
      needs.check-version.result == 'success' && (
        needs.check-version.outputs.should-build == 'true' ||
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      # Step 1: Capture build timestamp
      - name: Capture Build Timestamp
        id: timestamp
        run: |
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Build timestamp: $BUILD_TIMESTAMP"

      # Step 2: Checkout the repository (Dockerfile + wrapper, etc.)
      - name: Checkout Code
        uses: actions/checkout@v6

      # Step 2: Log in to GitHub Container Registry (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Set up QEMU & Buildx for multi‑arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      # Step 4: Set version variables from check-version job output
      - name: Set Version Variables
        id: tag
        run: |
          LATEST_RELEASE_TAG="${{ needs.check-version.outputs.new-version }}"
          RELEASE_TAG="${{ needs.check-version.outputs.release-tag }}"
          echo "Latest Release Tag: $LATEST_RELEASE_TAG"
          echo "Sanitized Release Tag: $RELEASE_TAG"
          {
            echo "LATEST_RELEASE_TAG=$LATEST_RELEASE_TAG"
            echo "RELEASE_TAG=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      # Step 5: Verify upstream release tag signature
      - name: Verify Release Tag Signature
        id: verify
        run: |
          echo "Cloning Manager.io repository to verify tag signature..."
          git clone --depth 1 --branch ${{ steps.tag.outputs.LATEST_RELEASE_TAG }} https://github.com/Manager-io/Manager.git /tmp/manager-repo || {
            echo "⚠️ Failed to clone repository at tag ${{ steps.tag.outputs.LATEST_RELEASE_TAG }}"
            echo "Attempting to fetch tag separately..."
            git clone https://github.com/Manager-io/Manager.git /tmp/manager-repo
            cd /tmp/manager-repo
            git fetch origin tag ${{ steps.tag.outputs.LATEST_RELEASE_TAG }}
          }
          cd /tmp/manager-repo
          
          # Try to verify the tag signature
          echo "Attempting to verify tag signature for ${{ steps.tag.outputs.LATEST_RELEASE_TAG }}..."
          if git verify-tag ${{ steps.tag.outputs.LATEST_RELEASE_TAG }} 2>&1 | tee /tmp/verify-output.txt; then
            echo "✅ Tag signature verified successfully"
            echo "VERIFICATION_STATUS=✅ Verified" >> $GITHUB_OUTPUT
            echo "VERIFICATION_DETAILS=GPG signature verified successfully" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Tag verification output:"
            cat /tmp/verify-output.txt || true
            # Check if tag is signed but keys aren't available (common for GitHub releases)
            if grep -q "No public key" /tmp/verify-output.txt || grep -q "no signature found" /tmp/verify-output.txt; then
              echo "⚠️ Tag is not GPG-signed or public key not available. This is common for GitHub releases."
              echo "Proceeding with additional verification steps (VirusTotal scan)..."
              echo "VERIFICATION_STATUS=⚠️ Not signed or key unavailable" >> $GITHUB_OUTPUT
              echo "VERIFICATION_DETAILS=Tag is not GPG-signed or public key not available" >> $GITHUB_OUTPUT
            else
              echo "❌ Tag verification failed"
              echo "VERIFICATION_STATUS=❌ Failed" >> $GITHUB_OUTPUT
              echo "VERIFICATION_DETAILS=Tag verification failed" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

      # Step 6: Download binary for verification and VirusTotal scan
      - name: Download Manager.io Binary
        id: download
        run: |
          # Download amd64 binary for scanning (we'll build both architectures later)
          TARGET=x64
          DOWNLOAD_URL="https://github.com/Manager-io/Manager/releases/download/${{ steps.tag.outputs.LATEST_RELEASE_TAG }}/ManagerServer-linux-${TARGET}.tar.gz"
          echo "Downloading from: $DOWNLOAD_URL"
          
          curl -L "$DOWNLOAD_URL" --output /tmp/manager-server-amd64.tar.gz
          
          # Compute SHA256 hash
          BINARY_SHA256=$(sha256sum /tmp/manager-server-amd64.tar.gz | awk '{print $1}')
          echo "Binary SHA256: $BINARY_SHA256"
          echo "BINARY_SHA256=$BINARY_SHA256" >> $GITHUB_OUTPUT
          
          # Log file info for audit trail
          ls -lh /tmp/manager-server-amd64.tar.gz
          stat /tmp/manager-server-amd64.tar.gz

      # Step 7: Scan binary with VirusTotal
      - name: VirusTotal Scan
        id: virustotal
        continue-on-error: true
        run: |
          if [ -z "$VIRUSTOTAL_API_KEY" ]; then
            echo "⚠️ VIRUSTOTAL_API_KEY secret not configured. Skipping VirusTotal scan."
            echo "⚠️ For full supply chain security, please add VIRUSTOTAL_API_KEY to repository secrets."
            echo "SCAN_STATUS=⚠️ Skipped (API key not configured)" >> $GITHUB_OUTPUT
            echo "SCAN_URL=N/A" >> $GITHUB_OUTPUT
            echo "SCAN_DETAILS=VirusTotal API key not configured" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Submitting binary to VirusTotal for scanning..."
          
          # Step 1: Get upload URL from VirusTotal (supports large files, no size limit)
          echo "Requesting upload URL from VirusTotal..."
          UPLOAD_URL=$(curl -s --request GET \
            --url "https://www.virustotal.com/api/v3/files/upload_url" \
            --header "x-apikey: $VIRUSTOTAL_API_KEY" | jq -r '.data')
          
          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "❌ Failed to get upload URL from VirusTotal"
            echo "SCAN_STATUS=❌ Failed" >> $GITHUB_OUTPUT
            echo "SCAN_URL=N/A" >> $GITHUB_OUTPUT
            echo "SCAN_DETAILS=Failed to get upload URL from VirusTotal" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Upload URL obtained successfully"
          
          # Step 2: Upload file to the obtained URL
          UPLOAD_RESPONSE=$(curl -s --request POST \
            --url "$UPLOAD_URL" \
            --header "x-apikey: $VIRUSTOTAL_API_KEY" \
            --form "file=@/tmp/manager-server-amd64.tar.gz")
          
          echo "Upload response: $UPLOAD_RESPONSE"
          
          # Extract analysis ID
          ANALYSIS_ID=$(echo "$UPLOAD_RESPONSE" | jq -r '.data.id')
          echo "Analysis ID: $ANALYSIS_ID"
          
          # Extract file SHA256 from upload response to construct scan URL
          # VirusTotal API returns the hash in .data.attributes.sha256 or .meta.file_info.sha256
          # If extraction fails, use empty string to trigger fallback URL
          FILE_SHA256=$(echo "$UPLOAD_RESPONSE" | jq -r '.data.attributes.sha256 // .meta.file_info.sha256 // empty')
          echo "Extracted SHA256: $FILE_SHA256"
          if [ -n "$FILE_SHA256" ]; then
            SCAN_URL="https://www.virustotal.com/gui/file/$FILE_SHA256/detection"
            echo "VirusTotal scan URL: $SCAN_URL"
          else
            # Use binary SHA256 from download step as fallback
            SCAN_URL="https://www.virustotal.com/gui/file/${{ steps.download.outputs.BINARY_SHA256 }}/detection"
            echo "Using binary SHA256 for scan URL"
          fi
          
          # Wait for analysis to complete (poll every 15 seconds, max 5 minutes)
          echo "Waiting for VirusTotal analysis to complete..."
          ANALYSIS_COMPLETED=false
          for i in {1..20}; do
            sleep 15
            ANALYSIS_RESPONSE=$(curl -s --request GET \
              --url "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" \
              --header "x-apikey: $VIRUSTOTAL_API_KEY")
            
            STATUS=$(echo "$ANALYSIS_RESPONSE" | jq -r '.data.attributes.status')
            echo "Analysis status (iteration $i): $STATUS"
            
            if [ "$STATUS" = "completed" ]; then
              echo "✅ Analysis completed"
              ANALYSIS_COMPLETED=true
              
              # Check results
              MALICIOUS=$(echo "$ANALYSIS_RESPONSE" | jq -r '.data.attributes.stats.malicious')
              SUSPICIOUS=$(echo "$ANALYSIS_RESPONSE" | jq -r '.data.attributes.stats.suspicious')
              UNDETECTED=$(echo "$ANALYSIS_RESPONSE" | jq -r '.data.attributes.stats.undetected // 0')
              
              echo "VirusTotal Results:"
              echo "  Malicious detections: $MALICIOUS"
              echo "  Suspicious detections: $SUSPICIOUS"
              echo "  Undetected: $UNDETECTED"
              
              if [ "$MALICIOUS" -gt 0 ] || [ "$SUSPICIOUS" -gt 3 ]; then
                echo "❌ Binary failed VirusTotal scan!"
                echo "Full results: $ANALYSIS_RESPONSE"
                echo "SCAN_STATUS=❌ Failed ($MALICIOUS malicious, $SUSPICIOUS suspicious)" >> $GITHUB_OUTPUT
                echo "SCAN_URL=$SCAN_URL" >> $GITHUB_OUTPUT
                echo "SCAN_DETAILS=$MALICIOUS malicious, $SUSPICIOUS suspicious detections" >> $GITHUB_OUTPUT
                exit 1
              fi
              
              echo "✅ Binary passed VirusTotal scan"
              if [ "$UNDETECTED" -gt 0 ]; then
                echo "SCAN_STATUS=✅ Clean ($UNDETECTED engines, 0 malicious)" >> $GITHUB_OUTPUT
                echo "SCAN_DETAILS=0 malicious detections from $UNDETECTED security vendors" >> $GITHUB_OUTPUT
              else
                echo "SCAN_STATUS=✅ Clean (0 malicious)" >> $GITHUB_OUTPUT
                echo "SCAN_DETAILS=0 malicious detections" >> $GITHUB_OUTPUT
              fi
              echo "SCAN_URL=$SCAN_URL" >> $GITHUB_OUTPUT
              break
            fi
          done
          
          # Check if we timed out
          if [ "$ANALYSIS_COMPLETED" = "false" ]; then
            echo "⚠️ Analysis did not complete within timeout (status: $STATUS)"
            echo "SCAN_STATUS=⚠️ Timeout (last status: $STATUS)" >> $GITHUB_OUTPUT
            echo "SCAN_URL=$SCAN_URL" >> $GITHUB_OUTPUT
            echo "SCAN_DETAILS=Analysis did not complete within 5 minutes (last status: $STATUS)" >> $GITHUB_OUTPUT
          fi
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      # Step 8: Get base image digests for manifest
      - name: Get Base Image Digests
        id: base_images
        run: |
          # Pull images to get their digests
          docker pull alpine@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
          docker pull mcr.microsoft.com/dotnet/runtime-deps@sha256:d9c7a38d050c9bb90cf5453e8a8217a7eb9df77db3cf8100f4f84d1fb57b5124
          
          ALPINE_DIGEST="sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659"
          DOTNET_DIGEST="sha256:d9c7a38d050c9bb90cf5453e8a8217a7eb9df77db3cf8100f4f84d1fb57b5124"
          
          echo "ALPINE_DIGEST=$ALPINE_DIGEST" >> $GITHUB_OUTPUT
          echo "DOTNET_DIGEST=$DOTNET_DIGEST" >> $GITHUB_OUTPUT

      # Step 9: Build & push Docker image (immutable tags + mutable latest)
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Manager.io
            org.opencontainers.image.description=Docker wrapper for Manager.io application
            org.opencontainers.image.source=https://github.com/Manager-io/Manager
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.version=${{ steps.tag.outputs.LATEST_RELEASE_TAG }}
          build-args: |
            MANAGER_VERSION=${{ steps.tag.outputs.LATEST_RELEASE_TAG }}

      # Step 10: Install Cosign for image signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      # Step 11: Sign the Docker image with Cosign (keyless)
      - name: Sign Docker Image with Cosign
        run: |
          echo "Signing Docker image with Cosign (keyless signing)..."
          
          # Sign each tag
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}@${{ steps.build.outputs.digest }}
          
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest@${{ steps.build.outputs.digest }}
          
          echo "✅ Image signed successfully with Cosign"

      # Step 12: Create build manifest
      - name: Create Build Manifest
        id: manifest
        run: |
          MANIFEST_FILE="build-manifest-${{ steps.tag.outputs.RELEASE_TAG }}.json"
          
          cat > "$MANIFEST_FILE" <<EOF
          {
            "version": "${{ steps.tag.outputs.LATEST_RELEASE_TAG }}",
            "sanitized_version": "${{ steps.tag.outputs.RELEASE_TAG }}",
            "build_timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "github_sha": "${{ github.sha }}",
            "github_ref": "${{ github.ref }}",
            "github_workflow": "${{ github.workflow }}",
            "github_run_id": "${{ github.run_id }}",
            "github_run_number": "${{ github.run_number }}",
            "binary": {
              "amd64_sha256": "${{ steps.download.outputs.BINARY_SHA256 }}",
              "download_url": "https://github.com/Manager-io/Manager/releases/download/${{ steps.tag.outputs.LATEST_RELEASE_TAG }}/ManagerServer-linux-x64.tar.gz"
            },
            "base_images": {
              "alpine": {
                "digest": "${{ steps.base_images.outputs.ALPINE_DIGEST }}",
                "reference": "alpine@${{ steps.base_images.outputs.ALPINE_DIGEST }}"
              },
              "dotnet_runtime_deps": {
                "digest": "${{ steps.base_images.outputs.DOTNET_DIGEST }}",
                "reference": "mcr.microsoft.com/dotnet/runtime-deps@${{ steps.base_images.outputs.DOTNET_DIGEST }}"
              }
            },
            "docker_image": {
              "digest": "${{ steps.build.outputs.digest }}",
              "tags": [
                "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest",
                "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}",
                "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}-${{ github.sha }}"
              ],
              "platforms": ["linux/amd64", "linux/arm64"],
              "signed_with_cosign": true
            },
            "reproducibility": {
              "instructions": "To reproduce this build, use the exact base image digests and Manager.io version specified above."
            }
          }
          EOF
          
          echo "Build manifest created:"
          cat "$MANIFEST_FILE"
          echo "MANIFEST_FILE=$MANIFEST_FILE" >> $GITHUB_OUTPUT

      # Step 13: Update audit log
      - name: Update Audit Log
        run: |
          AUDIT_LOG="audit.log"
          
          # Create audit log if it doesn't exist
          if [ ! -f "$AUDIT_LOG" ]; then
            echo "# Docker Manager.io Build Audit Log" > "$AUDIT_LOG"
            echo "# Automated builds with supply chain security verification" >> "$AUDIT_LOG"
            echo "" >> "$AUDIT_LOG"
          fi
          
          # Append build entry
          cat >> "$AUDIT_LOG" <<EOF
          ========================================
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Version: ${{ steps.tag.outputs.LATEST_RELEASE_TAG }}
          GitHub SHA: ${{ github.sha }}
          Run ID: ${{ github.run_id }}
          Binary SHA256: ${{ steps.download.outputs.BINARY_SHA256 }}
          Image Digest: ${{ steps.build.outputs.digest }}
          Cosign Signed: Yes
          Manifest: ${{ steps.manifest.outputs.MANIFEST_FILE }}
          ========================================
          
          EOF
          
          echo "Audit log updated"

      # Step 14: Commit build manifest and audit log
      - name: Commit Build Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add ${{ steps.manifest.outputs.MANIFEST_FILE }} audit.log
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add build manifest and audit log for ${{ steps.tag.outputs.LATEST_RELEASE_TAG }}"
            git push
            echo "✅ Build manifest and audit log committed to repository"
          fi

      # Step 15: (Optional) Save the image digest for audit/rollback
      - name: Save image digest
        if: always()
        run: |
          echo "${{ steps.build.outputs.digest }}" > image-digest.txt

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-digest
          path: image-digest.txt

      # Step 16: Create a GitHub release mirroring the upstream version
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ steps.tag.outputs.RELEASE_TAG }}"
          name: "Manager.io ${{ steps.tag.outputs.RELEASE_TAG }}"
          body: |
            Auto‑generated release – Docker image built from upstream Manager.io ${{ steps.tag.outputs.LATEST_RELEASE_TAG }}.

            **Upstream Manager.io**
            - Release: [${{ steps.tag.outputs.LATEST_RELEASE_TAG }}](https://github.com/Manager-io/Manager/releases/tag/${{ steps.tag.outputs.LATEST_RELEASE_TAG }})
            - Verified via: `git verify-tag`

            **Build Information**
            - Build Timestamp: ${{ steps.timestamp.outputs.BUILD_TIMESTAMP }}
            - Workflow Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Security Verification**
            - Manager.io Release Signature: ${{ steps.verify.outputs.VERIFICATION_STATUS }}
              - Details: ${{ steps.verify.outputs.VERIFICATION_DETAILS }}
            - VirusTotal Scan: ${{ steps.virustotal.outputs.SCAN_STATUS }}
              - Binary SHA256: `${{ steps.download.outputs.BINARY_SHA256 }}`
              - [View Scan Results](${{ steps.virustotal.outputs.SCAN_URL }})
              - Details: ${{ steps.virustotal.outputs.SCAN_DETAILS }}

            **Docker Images**
            - `latest`
            - `${{ steps.tag.outputs.RELEASE_TAG }}`
            - `${{ steps.tag.outputs.RELEASE_TAG }}-${{ github.sha }}`

            **Registry**
            `ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}`

          draft: false
          prerelease: false
          allowUpdates: true
