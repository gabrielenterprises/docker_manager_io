name: Builder
on:
  workflow_dispatch:

# --------------------------------------------------------------
# Permissions – the automatically‑provided GITHUB_TOKEN is used.
# --------------------------------------------------------------
permissions:
  contents: read        # needed for actions/checkout
  packages: write       # needed to push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣ Checkout the repository (Dockerfile, wrapper, etc.)
      # --------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # 2️⃣ Log in to GitHub Container Registry (GHCR)
      # --------------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------
      # 3️⃣ Set up QEMU & Buildx for multi‑arch builds
      # --------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      # --------------------------------------------------------------
      # 4️⃣ Determine the latest upstream Manager.io release tag
      # --------------------------------------------------------------
      - name: Get Latest Release Tag
        id: tag
        run: |
          LATEST_RELEASE_TAG=$(curl -sL https://api.github.com/repos/Manager-io/Manager/releases/latest | jq -r '.tag_name')
          echo "Latest Release Tag: $LATEST_RELEASE_TAG"
          # Strip characters that are unsafe for Docker tags
          RELEASE_TAG=$(echo "${LATEST_RELEASE_TAG}" | tr -d 'v~,%@+;:/ ')
          echo "Sanitized Release Tag: $RELEASE_TAG"
          echo "LATEST_RELEASE_TAG=$LATEST_RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------
      # 5️⃣ Supply‑chain hygiene – verify SHA‑256 from release notes,
      #     selecting the hash that matches the exact tarball we download.
      # --------------------------------------------------------------
      - name: Verify upstream tarball checksum (from release notes, file‑specific)
        id: checksum
        run: |
          # ----- 1️⃣ Determine target architecture (must match Dockerfile) -----
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            TARGET=arm64
          else
            TARGET=x64
          fi

          # ----- 2️⃣ Build URLs -------------------------------------------------
          TAR_URL="https://github.com/Manager-io/Manager/releases/download/${{ steps.tag.outputs.LATEST_RELEASE_TAG }}/ManagerServer-linux-${TARGET}.tar.gz"
          RELEASE_API="https://api.github.com/repos/Manager-io/Manager/releases/tags/${{ steps.tag.outputs.LATEST_RELEASE_TAG }}"

          # ----- 3️⃣ Download the tarball ----------------------------------------
          echo "Downloading tarball ..."
          curl -L "$TAR_URL" -o /tmp/manager-server.tar.gz

          # ----- 4️⃣ Fetch the release notes (markdown body) --------------------
          echo "Fetching release notes ..."
          RELEASE_BODY=$(curl -s "$RELEASE_API" | jq -r '.body')

          # ----- 5️⃣ Extract the SHA‑256 that belongs to the exact filename -----
          FILENAME="ManagerServer-linux-${TARGET}.tar.gz"
          EXPECTED_HASH=$(printf "%s" "$RELEASE_BODY" |
            grep -i "$FILENAME" |
            grep -Eo '[a-f0-9]{64}' |
            head -n1)

          if [ -z "$EXPECTED_HASH" ]; then
            echo "❌ Could NOT find a SHA‑256 hash for the file:"
            echo "    $FILENAME"
            echo "Release notes excerpt (first 500 characters):"
            echo "${RELEASE_BODY:0:500}"
            echo ""
            echo "If the format of the release notes has changed, you may need to adjust the extraction regex."
            exit 1
          fi

          echo "✅ Extracted expected SHA‑256 for ${TARGET}: $EXPECTED_HASH"

          # ----- 6️⃣ Compute the actual hash of the downloaded tarball ----------
          ACTUAL_HASH=$(sha256sum /tmp/manager-server.tar.gz | awk '{print $1}')
          echo "Actual SHA‑256 of downloaded tarball: $ACTUAL_HASH"

          # ----- 7️⃣ Compare ----------------------------------------------------
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "❌ HASH MISMATCH – the tarball does NOT match the release note."
            exit 1
          fi

          echo "✅ Hash matches – integrity verified."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------
      # 6️⃣ Docker metadata (GHCR only)
      # --------------------------------------------------------------
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=pep440,pattern={{version}},value=${{ steps.tag.outputs.RELEASE_TAG }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Manager.io
            org.opencontainers.image.source=https://github.com/Manager-io/Manager
            org.opencontainers.image.version=${{ steps.tag.outputs.RELEASE_TAG }}
            org.opencontainers.image.licenses=GPL-3.0

      # --------------------------------------------------------------
      # 7️⃣ Build & push the Docker image (multi‑arch)
      # --------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MANAGER_VERSION=${{ steps.tag.outputs.LATEST_RELEASE_TAG }}

      # --------------------------------------------------------------
      # 8️⃣ Create a GitHub release mirroring the upstream version
      # --------------------------------------------------------------
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ steps.tag.outputs.RELEASE_TAG }}"
          name: "Manager.io ${{ steps.tag.outputs.RELEASE_TAG }}"
          body: |
            Auto‑generated release – Docker image built from upstream Manager.io ${{ steps.tag.outputs.LATEST_RELEASE_TAG }}.

            **SHA‑256 checksum verified** for the upstream tarball.

            **Docker image:** `ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}`

          draft: false
          prerelease: false
          allowUpdates: true
