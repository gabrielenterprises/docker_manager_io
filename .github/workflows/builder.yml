name: Builder
on:
  schedule:
    - cron: "0 0 * * *"  # daily at 00:00 UTC
  workflow_dispatch:      # manual trigger

# --------------------------------------------------------------
# Explicit permissions for the automatically‑provided GITHUB_TOKEN
# --------------------------------------------------------------
permissions:
  contents: write        # needed to create a GitHub release (tag + release)
  packages: write        # needed to push to GHCR

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.check.outputs.new-version }}
      should-build: ${{ steps.check.outputs.should-build }}
      release-tag: ${{ steps.check.outputs.release-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all history to get tags

      - name: Check for version change
        id: check
        run: |
          # Get latest upstream Manager.io version
          LATEST=$(curl -sL https://api.github.com/repos/Manager-io/Manager/releases/latest | jq -r '.tag_name')
          echo "Latest upstream version: $LATEST"
          
          # Get last built version from repo tags
          LAST_BUILT=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "Last built version: $LAST_BUILT"
          
          # Strip characters that are unsafe for Docker tags
          RELEASE_TAG=$(echo "${LATEST}" | tr -d 'v~,%@+;:/ ')
          echo "Sanitized release tag: $RELEASE_TAG"
          
          # Only build if versions differ
          if [ "$LATEST" != "$LAST_BUILT" ]; then
            echo "✅ Version changed from $LAST_BUILT to $LATEST - build required"
            {
              echo "should-build=true"
              echo "new-version=$LATEST"
              echo "release-tag=$RELEASE_TAG"
            } >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ Version unchanged ($LATEST) - skipping build"
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check-version
    if: needs.check-version.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository (Dockerfile + wrapper, etc.)
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Set up QEMU & Buildx for multi‑arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      # Step 4: Set version variables from check-version job output
      - name: Set Version Variables
        id: tag
        run: |
          LATEST_RELEASE_TAG="${{ needs.check-version.outputs.new-version }}"
          RELEASE_TAG="${{ needs.check-version.outputs.release-tag }}"
          echo "Latest Release Tag: $LATEST_RELEASE_TAG"
          echo "Sanitized Release Tag: $RELEASE_TAG"
          {
            echo "LATEST_RELEASE_TAG=$LATEST_RELEASE_TAG"
            echo "RELEASE_TAG=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      # Step 5: Build & push Docker image (immutable tags + mutable latest)
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Manager.io
            org.opencontainers.image.description=Docker wrapper for Manager.io application
            org.opencontainers.image.source=https://github.com/Manager-io/Manager
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.version=${{ steps.tag.outputs.LATEST_RELEASE_TAG }}
          build-args: |
            MANAGER_VERSION=${{ steps.tag.outputs.LATEST_RELEASE_TAG }}

      # Step 6: (Optional) Save the image digest for audit/rollback
      - name: Save image digest
        if: always()
        run: |
          echo "${{ steps.build.outputs.digest }}" > image-digest.txt

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt

      # Step 7: Create a GitHub release mirroring the upstream version
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ steps.tag.outputs.RELEASE_TAG }}"
          name: "Manager.io ${{ steps.tag.outputs.RELEASE_TAG }}"
          body: |
            Auto‑generated release – Docker image built from upstream Manager.io ${{ steps.tag.outputs.LATEST_RELEASE_TAG }}.

            **Docker image tags:**
            - `latest`
            - `${{ steps.tag.outputs.RELEASE_TAG }}`
            - `${{ steps.tag.outputs.RELEASE_TAG }}-${{ github.sha }}`

            **Docker image:** `ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.RELEASE_TAG }}`

          draft: false
          prerelease: false
          allowUpdates: true
