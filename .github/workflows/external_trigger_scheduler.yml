name: External Trigger Scheduler
on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:      # also allow manual runs

# --------------------------------------------------------------
# Permissions needed for this workflow
# --------------------------------------------------------------
permissions:
  contents: read        # checkout the repo (read‑only)
  actions: write        # dispatch the external_trigger workflow
  # (no other scopes are required)

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch external_trigger for the default branch
        env:
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "🕒 Scheduler running for repository: $REPO"
          echo "📦 Default branch is: $DEFAULT_BRANCH"

          # Call the GitHub API to start the external_trigger workflow
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"ref\":\"refs/heads/${DEFAULT_BRANCH}\"}" \
            "https://api.github.com/repos/${REPO}/actions/workflows/external_trigger.yml/dispatches"

          echo "✅ Dispatched external_trigger workflow for ${DEFAULT_BRANCH}"
