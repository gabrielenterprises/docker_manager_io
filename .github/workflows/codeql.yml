name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request: {}
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'dockerfile' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@6.0.2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2.25.0
      with:
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2.25.0
